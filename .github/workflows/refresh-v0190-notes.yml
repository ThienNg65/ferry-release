name: Refresh v0.19.0 release notes (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-v0190-notes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare notes from public changelog
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const start = changelog.indexOf('## 0.19.0 (');
          if (start < 0) throw new Error('v0.19.0 section not found');
          const next = changelog.indexOf('\n## ', start + 4);
          const section = changelog.slice(start, next < 0 ? undefined : next).trim();
          if (!section.includes('### Highlights') || section.includes('github.com/ThienNg65/ferry/')) {
            throw new Error('Expected public-facing highlights without private source links');
          }
          const notes = section + '\n\n### Download\n\nDownload `Ferry-Setup-0.19.0.exe` under **Assets** for Windows x64.\n';
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'ferry-v0190-notes.md'), notes);
          NODE
      - name: Update published GitHub Release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit ferry-v0.19.0 --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/ferry-v0190-notes.md"
